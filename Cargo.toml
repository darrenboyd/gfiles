[package]
name = "gfiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Catalog and organize your files across all your machines"

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
gethostname = "1.1.0"
ignore = "0.4.34"
ratatui = "0.30.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "0.25.19"
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
